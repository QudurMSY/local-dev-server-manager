<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Server 1 -->
  <g filter="url(#glow)">
    <path d="M96 120 C96 100, 416 100, 416 120 L416 170 C416 190, 96 190, 96 170 Z" fill="url(#cyanGrad)" opacity="0.9" />
    <rect x="96" y="110" width="320" height="50" rx="12" fill="#090d16" stroke="#22d3ee" stroke-width="4" />
    <circle cx="136" cy="135" r="8" fill="#34d399" />
    <circle cx="160" cy="135" r="8" fill="#38bdf8" />
    <line x1="200" y1="135" x2="380" y2="135" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round" />
  </g>

  <!-- Server 2 -->
  <g filter="url(#glow)">
    <rect x="96" y="190" width="320" height="50" rx="12" fill="#090d16" stroke="#38bdf8" stroke-width="4" />
    <circle cx="136" cy="215" r="8" fill="#34d399" />
    <circle cx="160" cy="215" r="8" fill="#38bdf8" />
    <line x1="200" y1="215" x2="380" y2="215" stroke="#34d399" stroke-width="4" stroke-dasharray="12 8" stroke-linecap="round" />
  </g>

  <!-- Server 3 -->
  <g filter="url(#glow)">
    <rect x="96" y="270" width="320" height="50" rx="12" fill="#090d16" stroke="#34d399" stroke-width="4" />
    <circle cx="136" cy="295" r="8" fill="#34d399" />
    <circle cx="160" cy="295" r="8" fill="#facc15" />
    <line x1="200" y1="295" x2="380" y2="295" stroke="#22d3ee" stroke-width="4" stroke-dasharray="10 6" stroke-linecap="round" />
  </g>

  <!-- Server 4 -->
  <g filter="url(#glow)">
    <rect x="96" y="350" width="320" height="50" rx="12" fill="#090d16" stroke="url(#emeraldGrad)" stroke-width="4" />
    <circle cx="136" cy="375" r="8" fill="#34d399" />
    <circle cx="160" cy="375" r="8" fill="#34d399" />
    <line x1="200" y1="375" x2="380" y2="375" stroke="#34d399" stroke-width="4" stroke-dasharray="16 8" stroke-linecap="round" />
  </g>
</svg>
